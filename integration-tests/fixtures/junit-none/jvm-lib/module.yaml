product: jvm/lib

settings:
  kotlin:
    version: 2.4.10
  # "Add no JUnit adapter", not "do not run the JUnit platform": the module brings its own engine
  # below, and the converted build still has to discover the tests written against it.
  junit: none
  jvm:
    jdk:
      version: 25
    release: 17

test-dependencies:
  - org.junit.jupiter:junit-jupiter:5.14.1
