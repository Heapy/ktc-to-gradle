product: jvm/lib

settings:
  kotlin:
    version: 2.4.10
    compilerPlugins:
      # all-open is a real compiler plugin with a real option, so the fixture fails to compile
      # unless the generated build actually loads it and passes the option through.
      - id: org.jetbrains.kotlin.allopen
        dependency: org.jetbrains.kotlin:kotlin-allopen-compiler-plugin:2.4.10
        options:
          annotation: example.plugin.Open
  jvm:
    jdk:
      version: 25
    release: 17
