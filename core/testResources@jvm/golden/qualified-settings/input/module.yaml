product:
  type: kmp/lib
  platforms: [jvm, linuxX64]

settings:
  kotlin:
    allWarningsAsErrors: true

settings@jvm:
  kotlin:
    languageVersion: 2.2
    optIns: [kotlin.ExperimentalStdlibApi]
  jvm:
    release: 21

settings@linuxX64:
