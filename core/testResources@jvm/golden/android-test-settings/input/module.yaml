product: android/app

settings:
  junit: junit-4
  android:
    namespace: example.testsettings
  jvm:
    test:
      freeJvmArgs: [-Xmx512m]
      systemProperties:
        reportMode: base
        reportKept: base
      extraEnvironment:
        REPORT_HOME: /tmp/base

test-settings:
  jvm:
    freeJvmArgs: [-XX:+UseZGC]
    systemProperties:
      reportMode: test
