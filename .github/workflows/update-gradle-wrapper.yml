name: Update Gradle wrapper

# Tracks Gradle's latest stable release; prereleases require an explicit dispatch version.

on:
  schedule:
    # Mondays, 04:17 UTC. Off the hour because every scheduled job on the hour queues together.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Gradle version to pin, or empty for the latest stable release"
        required: false
        default: ""

concurrency:
  group: update-gradle-wrapper
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Through env and quoted: a dispatch input goes straight into a shell, a URL, a sed pattern
      # and a branch name, so it is checked before any of them see it.
      - name: Regenerate the embedded wrapper
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ -n "$VERSION" ]; then
            case "$VERSION" in
              *[!0-9.]*|""|.*|*.) echo "Not a Gradle version: '$VERSION'" >&2; exit 1 ;;
            esac
          fi
          tools/update-gradle-wrapper.sh $VERSION

      - name: Stop early when nothing moved
        id: changes
        run: |
          # --porcelain and not `git diff --quiet`: a new Gradle can add a file, and a diff of
          # tracked paths would call that no change at all.
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on the latest Gradle."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(sed -n 's/.*GRADLE = "\(.*\)"/\1/p' core/src/io/heapy/ktctogradle/Versions.kt)" >> "$GITHUB_OUTPUT"
          fi

      # An update run deletes each baseline before rewriting it, so it compares nothing and is red
      # by design. continue-on-error rather than `|| true`: the step still shows as failed, so a
      # failure that is NOT the expected one is visible instead of painted green. The re-run
      # without the switch is the one that verifies.
      - name: Rewrite the golden baselines
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: UPDATE_SNAPSHOTS=1 ./kotlin test -m core -p jvm

      - name: Verify
        if: steps.changes.outputs.changed == 'true'
        run: ./kotlin test -m core -p jvm

      - name: Build the converted fixtures with the new wrapper
        if: steps.changes.outputs.changed == 'true'
        run: ./kotlin test -m integration-tests -p jvm

      - name: Open a pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.changes.outputs.version }}
        run: |
          set -eu
          BRANCH="gradle-wrapper/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: update the embedded Gradle wrapper to $VERSION

          Regenerated by tools/update-gradle-wrapper.sh. The distribution and the wrapper jar were
          both verified against the checksums services.gradle.org publishes beside the release.

          The golden baselines moved because the embedded wrapper is part of the generated output."
          # Plain --force, and the branch is named after the version: it belongs to this workflow
          # alone, so a rerun for the same version replaces its own earlier attempt. A lease would
          # need a remote-tracking ref that the single-commit checkout does not fetch.
          git push --force origin "HEAD:$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state >/dev/null 2>&1; then
            echo "A pull request for $BRANCH is already open; it now carries the new commit."
            exit 0
          fi
          gh pr create \
            --title "chore: update the embedded Gradle wrapper to $VERSION" \
            --body "Opened by the scheduled \`update-gradle-wrapper\` workflow.

          Read the diff of \`gradlew\`, \`gradlew.bat\` and the golden baselines before merging. The
          jar is binary: its checksum is the one services.gradle.org publishes as \`wrapperChecksum\`
          for $VERSION, and \`tools/update-gradle-wrapper.sh\` refuses to write it when they differ." \
            --head "$BRANCH" \
            --base main
